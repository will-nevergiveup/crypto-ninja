<title>Crypto Ninja</title>
<!--
  CRYPTO NINJA — single-file, offline. Slice crypto coins, dodge RUG bombs.

  URL parameters (all optional):
    lang=en|zh-Hant|zh-Hans|ko|ja|th|fr|es|it|de|ru   language (else saved choice, else browser language)
    diff=easy|normal|hard        difficulty (else saved choice, default normal)
    demo=1                       attract / QA mode: an AI blade plays (misses don't cost lives, auto-restarts)
    combo=N                      with demo: spawns a tight cluster of N coins (3..12, combo=1 means 6) at 1.0 s and every 7 s, sliced in one stroke
    bomb=1                       with demo: the AI deliberately slices a RUG bomb at ~3.4 s (EMP blast / game over)
    screen=start|play|over       jump to a state (over: plays 2 s on autopilot, then game over)
    reason=bomb|miss             with screen=over (default bomb)
    score=N                      with screen=over: final score shown (default 57)
    lives=1..3                   starting lives (QA)
    seed=N                       seeded RNG (gameplay and effects are deterministic for a given seed + window size)
    freeze=MS                    fast-forward the simulation to MS ms of game time at load, then freeze (for screenshots)
    quality=auto|high|med|low    effect tier (auto drops a tier when frame time rises)
    rm=1                         force reduced motion (also follows prefers-reduced-motion)
    safe=T,R,B,L                 fake safe-area insets in px (QA for notched phones; draws a fake notch / home bar)
    fps=1                        small frame-time / tier readout
    god=1                        missed coins cost no lives (QA for touch tests)
  Keys: P / Esc / Space pause · M sound · 1 2 3 difficulty on the start screen · Enter start / play again.
  Debug: window.CN = {state, freeze(bool), step(n), perf(), perfReset()}.
-->
<style>

  const dt=Math.max(.004,simT-(l?l.t:simT));if(l&&Math.hypot(x-l.x,y-l.y)<.5)return;
  if(l){const d=Math.hypot(x-l.x,y-l.y),sp=d/dt;b.speed=pts.length<2?sp:lerp(b.speed,sp,.5);

  if(state!=='play')return;

/* ====================== game flow ====================== */
function resetWorld(){coins.forEach(c=>c.live=0);halves.forEach(c=>c.live=0);spawnQ.length=0;pops.forEach(p=>p.live=0);
  NODES.forEach(n=>{n.on=1;n.lit=0;});LINKS.forEach(l=>l.brk=0);CUBES.forEach(c=>c.alive=1);netDark=0;empT=-1;}
function startGame(){resetWorld();state='play';musicSync();playT=0;score=0;lives=+Q.get('lives')||3;lives=clamp(lives,1,3);stats={coins:0,combo:0,dodged:0};newBest=false;
  spawnT=.6;cluT=COMBO_N?1:-1;bombScriptT=(BOMB_Q&&DEMO)||SCREEN==='over'?(SCREEN==='over'?2:3.4):-1;overT=-1;overShown=false;worldSlow=1;slowMin=1;slowT=slowDur=0;
  loadBest();prevBest=best;hud();ui();}

  for(let s=-1;s<=1;s+=2){const h=alloc(halves,CAP.halves),nx=-Math.sin(ang)*s,ny=Math.cos(ang)*s;Object.assign(h,{live:1,k:o.k,x,y,vx:nx*160*U,vy:ny*160*U-200*U,a:0,va:s*3,cut:ang,side:s,r:o.r,col:CINFO[o.k][1],t:0,dur:1.6,big:o.hero});}

function loseLife(c){if((DEMO&&SCREEN!=='over')||GOD)return;lives--;hud();pop('miss',clamp(c.x,30*U+20,CW-30*U-20),CH-36*U-20-SAFE.b,{dur:.8});shake(6,.2);flash(P.danger,.18,.2);sfx('miss');
  if(lives<=0){overReason='miss';gameOver('miss');}}
function gameOver(reason){if(state!=='play')return;state='over';overT=0;goStart=reason==='bomb'?1.25:0;overReason=reason;
  overBlock=1e5+((rnd()*8e5)|0);for(const b of blades.values())b.combo=0;

  if(score>best){newBest=prevBest>0||score>0;best=score;if(!DEMO)LS.set('best.'+DK,String(best));}

  CUBES.forEach((c,i)=>{c.brkAt=goStart+.5+i*.12;c.col=[P.elec,P.violet,P.green][i%3];});
  sfx('over');ui();}

function step(dt){
  simT+=dt;
  // world time: hit-stop + slow-mo (time-slow keeps the fixed step; it scales the sim dt)
  if(slowDur>0){slowT+=dt;const k=slowT/slowDur;worldSlow=k>=1?1:lerp(slowMin,1,k<.4?0:(k-.4)/.6);if(k>=1)slowDur=0;}
  let ws=worldSlow;
  if(state==='over'){overT+=dt;const k=clamp((overT-goStart*.6)/1.1,0,1);ws=Math.min(ws,lerp(1,0,outQuad(k)));
    if(DEMO&&overT>goStart+6&&SCREEN!=='over'){startGame();}}
  const fdt=dt*Math.max(ws,state==='over'?.06:0)*(state==='over'?1:1);let wdt=dt*ws;if(hitStop>0){hitStop-=dt;wdt=0;}
  if(state==='paused')return;
  // background
  const bt=simT;camO.x=RM?0:Math.sin(bt*.05)*40*U;camO.y=RM?0:Math.cos(bt*.07)*24*U;
  for(const n of NODES){const f=RM?.15:1;n.x=n.bx+Math.sin(bt*.3*f+n.ph)*6*U;n.y=n.by+Math.cos(bt*.25*f+n.ph)*6*U;if(n.lit>0)n.lit-=dt;
    if(empT>=0&&!n.on&&empT>n.boot){n.on=1;n.lit=Math.max(n.lit,.35);}}
  if(empT>=0){empT+=dt;netDark=empT<.9?1:Math.max(0,1-(empT-.9)/.8);if(empT>2.5)empT=-1;}
  if(state==='over')for(const l of LINKS)if(!l.brk&&overT>l.brkAt){l.brk=1;}
  if(state==='over')for(const c of CUBES)if(c.alive&&overT>c.brkAt){c.alive=0;tris(c.x,c.y,c.s,c.col);}
  if(rnd()<dt*(RM?.8:2.5)&&CLINKS.length&&state!=='over'){const l=CLINKS[RI(0,CLINKS.length-1)];packet(l.a,l.b,[P.green,P.elec][RI(0,1)],1);}
  if(rnd()<dt*(RM?.6:1.6)&&LINKS.length&&netDark<.5){const l=LINKS[RI(0,LINKS.length-1)];if(!l.brk)packet(l.a,l.b,nodeCol(NODES[l.a].bx/CW),0);}
  for(const p of packets)if(p.live){p.t+=dt;if(p.t>=p.dur)p.live=0;}
  // spawning + world
  if(state==='play'){playT+=wdt;
    if(cluT>=0){cluT-=wdt;if(cluT<0){aiCluster=cluster(COMBO_N);cluT=7;}}
    if(bombScriptT>=0&&playT>=bombScriptT){bombScriptT=-1;const c=launch('BOMB',CW/2,CW/2,CH*.38);c.vx=0;if(SCREEN==='over'||DEMO)aiBomb=c;}
    if(!COMBO_N||!aiCluster){spawnT-=wdt;if(spawnT<=0&&!spawnQ.length){wave();spawnT=DF.iv/diffK()+R(-.1,.25);}}
    for(let i=spawnQ.length-1;i>=0;i--){spawnQ[i].d-=wdt;if(spawnQ[i].d<=0){spawnOne(spawnQ[i].k);spawnQ.splice(i,1);}}}
  for(const c of coins){if(!c.live)continue;c.t+=wdt;c.vy+=G*wdt;c.x+=c.vx*wdt;c.y+=c.vy*wdt;c.a+=c.va*wdt;
    if(c.y<CH-c.r)c.ent=1;
    if(c.vy>0&&c.y>CH+c.r*1.3){c.live=0;if(state==='play'){if(c.bomb)stats.dodged++;else if(c.ent)loseLife(c);}}}
  for(const h of halves){if(!h.live)continue;h.t+=wdt;h.vy+=G*wdt;h.x+=h.vx*wdt;h.y+=h.vy*wdt;h.a+=h.va*wdt;if(h.t>h.dur||h.y>CH+h.r*2)h.live=0;}

    const dr=Math.pow(p.dr,pdt*60);p.vx*=dr;p.vy=p.vy*dr+p.gr*pdt;p.x+=p.vx*pdt;p.y+=p.vy*pdt;
    if(p.k===0){p.j+=pdt;if(p.j>.09){p.j=0;if(p.g<16)p.g=rnd()<.6?RI(0,1):RI(0,15);}}else if(p.k===3){p.j+=pdt;if(p.j>.06){p.j=0;p.x+=(rnd()-.5)*12*U;}}else if(p.k===4)p.a+=p.va*pdt;}
  nParts=np;
  for(const r of rings)if(r.live){r.t+=fdt||dt*.1;if(r.t>=r.dur)r.live=0;}
  for(const b of bolts)if(b.live){b.t+=dt;b.rj+=dt;if(b.rj>.05){b.rj=0;jitter(b);}if(b.t>=b.dur)b.live=0;}
  for(const p of pops)if(p.live){p.t+=p.kind==='combo'?dt:fdt||dt;if(p.t>=p.dur)p.live=0;}
  if(SH.t<SH.dur)SH.t+=dt;if(FL.t<FL.dur)FL.t+=dt;if(CA.t<CA.dur)CA.t+=dt;if(TR.t<TR.dur)TR.t+=dt;
  // blades: trim to last 110 ms, close combos after 250 ms without a hit
  for(const b of blades.values()){while(b.pts.length&&simT-b.pts[0].t>(b.down?.11:.06))b.pts.shift();if(!b.down&&b.fade>0)b.fade-=dt;
    if(b.combo){b.gap+=dt;if(b.gap>.25&&!b.ai)closeCombo(b);}if(b.down&&b.pts.length<2)b.speed*=.8;}
  if(state==='start'||startT>=0)menuT+=dt;
  if(DEMO||SCREEN==='over'&&state==='play')ai(dt);
}

  if(!frozen&&d>0&&d<.2){const ms=d*1000;PERF.n++;PERF.sum+=ms;PERF.work+=work;PERF.max=Math.max(PERF.max,ms);ema=lerp(ema,ms,.05);
    if(!TIER_PIN&&tier>0&&state!=='paused'){if(ema>24)slowFor+=d;else slowFor=Math.max(0,slowFor-d*.5);if(slowFor>2){tier--;QL=QT[tier];slowFor=0;ema=16.7;setup();}}}
  if(FPSQ){E.fps.style.display='block';E.fps.textContent=`${(ema).toFixed(1)} ms · ${QL.n} · p${nParts} · dpr${DPR.toFixed(2)}`;}}

/* ====================== boot ====================== */
buildAtlas();setup();buildLangMenu();
if(SCREEN==='play'||SCREEN==='over'||(DEMO&&SCREEN!=='start'&&(COMBO_N||BOMB_Q)))startGame();
if(SCREEN==='over'&&Q.get('reason')!=='miss')bombScriptT=2;
ui();
if(FREEZE>=0){const n=Math.round(FREEZE/1000/STEP);for(let i=0;i<n;i++)step(STEP);frozen=true;}
requestAnimationFrame(frame);
window.CN={get state(){return state;},get score(){return score;},freeze(v){frozen=v!==false;last=performance.now();},step(n){for(let i=0;i<(n||1);i++)step(STEP);},
  perf(){return{frames:PERF.n,avgFrameMs:PERF.n?PERF.sum/PERF.n:0,avgWorkMs:PERF.n?PERF.work/PERF.n:0,maxFrameMs:PERF.max,tier:QL.n,dpr:DPR,parts:nParts};},perfReset(){PERF.n=PERF.sum=PERF.work=PERF.max=0;},
  get fx(){return{state,overT,goStart,empT,combo:pops.filter(p=>p.live&&p.kind==='combo').map(p=>({n:p.n,t:p.t})),bolts:bolts.filter(b=>b.live).length,rings:rings.filter(r=>r.live).length,parts:nParts,tier:QL.n,menuT};},
  get coins(){return coins.filter(c=>c.live).map(c=>({k:c.k,x:c.x,y:c.y,r:c.r}));},get stats(){return{...stats,lives,best};},doPause,doResume};
